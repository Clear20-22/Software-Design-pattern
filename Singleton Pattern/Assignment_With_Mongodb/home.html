
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Singleton Pattern + MongoDB Atlas</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    padding:30px;
}

h1{
    text-align:center;
    color:#222;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:15px;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
}

.card{
    margin-top:30px;
    background:white;
    border-radius:12px;
    padding:25px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.success{
    color:green;
    font-weight:bold;
    font-size:18px;
}

.fail{
    color:red;
    font-weight:bold;
    font-size:18px;
}

.info{
    margin:12px 0;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#2563eb;
    color:white;
    padding:12px;
}

td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

tr:nth-child(even){
    background:#f8f8f8;
}

.loading{
    text-align:center;
    font-size:20px;
    margin-top:30px;
}

.header-box{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:25px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    margin-top:20px;
}

.stat-card{
    background:#eef4ff;
    border-radius:10px;
    padding:15px;
}

.stat-card h3{
    margin-bottom:8px;
}

</style>
</head>

<body>

<div class="header-box">

    <h1>Singleton Design Pattern Demonstration</h1>

    <p class="subtitle">
        FastAPI + MongoDB Atlas + Software Design Pattern
    </p>

</div>

<div class="buttons">

    <button onclick="loadPattern('eager')">
        Eager Singleton
    </button>

    <button onclick="loadPattern('lazy')">
        Lazy Singleton
    </button>

    <button onclick="loadPattern('safe')">
        Thread Safe
    </button>

    <button onclick="loadPattern('double')">
        Double Checked
    </button>

    <button onclick="loadPattern('bill')">
        Bill Pugh
    </button>

    <button onclick="loadPattern('enum')">
        Enum Style
    </button>

    <button onclick="runThreadTest()">
        🧵 Thread Test
    </button>

</div>

<div id="result"></div>

<script>

async function loadPattern(pattern){

    const resultDiv =
        document.getElementById("result");

    resultDiv.innerHTML =
        '<div class="loading">Loading...</div>';

    try{

        const response =
            await fetch(`/singleton/${pattern}`);

        const data =
            await response.json();

        let html = `
        <div class="card">

            <h2>${data.pattern}</h2>

            <div class="stat-grid">

                <div class="stat-card">
                    <h3>First Instance</h3>
                    <p>${data.first_id}</p>
                </div>

                <div class="stat-card">
                    <h3>Second Instance</h3>
                    <p>${data.second_id}</p>
                </div>

                <div class="stat-card">
                    <h3>Third Instance</h3>
                    <p>${data.third_id}</p>
                </div>

            </div>

            <br>

            <div class="${
                data.same_object ? "success" : "fail"
            }">

                ${
                    data.same_object
                    ? "✓ Singleton Verified"
                    : "✗ Singleton Failed"
                }

            </div>

            <br>

            <h3>
                MongoDB User Count:
                ${data.user_count}
            </h3>
        `;

        if(data.users.length > 0){

            html += `
            <table>

                <tr>
                    <th>#</th>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                </tr>
            `;

            data.users.forEach((user,index)=>{

                html += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${user.student_id || "-"}</td>
                    <td>${user.name || "-"}</td>
                    <td>${user.email || "-"}</td>
                    <td>${user.role || "-"}</td>
                </tr>
                `;
            });

            html += `</table>`;
        }
        else{

            html += `
            <p>No users found.</p>
            `;
        }

        html += `</div>`;

        resultDiv.innerHTML = html;
    }
    catch(error){

        resultDiv.innerHTML = `
        <div class="card">

            <h2 style="color:red">
                Connection Error
            </h2>

            <p>${error}</p>

        </div>
        `;
    }
}


async function runThreadTest(){

    const resultDiv =
        document.getElementById("result");

    resultDiv.innerHTML =
        '<div class="loading">Running 50 Thread Test...</div>';

    try{

        const response =
            await fetch('/all-thread-tests');

        const data =
            await response.json();

        let html = `
        <div class="card">

            <h2>
                Thread Safety Test
            </h2>

            <p>
                50 concurrent threads are created for each pattern.
            </p>

            <table>

                <tr>
                    <th>Pattern</th>
                    <th>Threads</th>
                    <th>Unique Instances</th>
                    <th>Instance ID</th>
                    <th>Result</th>
                </tr>
        `;

        data.forEach(item => {

            html += `
            <tr>
                <td>${item.pattern}</td>
                <td>${item.threads}</td>
                <td>${item.unique_instances}</td>
                <td>${item.instance_id}</td>
                <td>
                    ${
                        item.thread_safe
                        ? "✅ PASS"
                        : "❌ FAIL"
                    }
                </td>
            </tr>
            `;
        });

        html += `
            </table>

        </div>
        `;

        resultDiv.innerHTML = html;

    }
    catch(error){

        resultDiv.innerHTML = `
        <div class="card">

            <h2 style="color:red">
                Thread Test Failed
            </h2>

            <p>${error}</p>

        </div>
        `;
    }
}

</script>

</body>
</html>
